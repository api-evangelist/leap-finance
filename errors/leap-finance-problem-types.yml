  example_observed: >-
    {"type":"about:blank","title":"Bad Request","status":400,"detail":"Failed to
    convert 'preUserId' with value ..."}
  note: >-
    `type` is the literal "about:blank", which RFC 9457 §4.2.1 defines as "no
    additional semantics". Nothing is dereferenceable, so an agent receiving this
    learns the HTTP status and a human-readable sentence and nothing more. The shape
    is the Spring Boot 3 default ProblemDetail representation, which the framework
    emits automatically — it is not evidence of a designed error taxonomy.

