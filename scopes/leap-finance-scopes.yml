findings:
  resource_scopes: 0
  note: >-
    The absence of any resource-specific scope is itself the finding. A provider that
    exposed a programmatic API through this tenant would register an Auth0 API and
    advertise its permissions here. Leap Finance advertises only identity scopes,
    which is consistent with the tenant existing solely to log borrowers and staff
    into first-party web applications.
