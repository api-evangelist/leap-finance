aid: leap-finance
name: Leap Finance
description: 'Leap Finance Inc. is a Bengaluru- and US-incorporated fintech that underwrites
  collateral-free education loans for Indian students pursuing graduate study abroad,
  underwriting on future earning potential and academic profile rather than family
  assets or collateral. The company originates and services study-abroad student loans
  covering tuition, living costs and travel, and also maintains www.leapscholar.com,
  its study-abroad counselling and IELTS preparation property. Leap Finance operates
  as a direct-to-consumer lender: it publishes a consumer web application, a partner
  portal and an Auth0-backed identity tenant, but does not operate a public developer
  program, publish API documentation, or ship a machine-readable API contract.'
